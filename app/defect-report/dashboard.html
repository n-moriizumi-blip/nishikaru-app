<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1F3A52">
<title>西軽精機アプリ｜品質不良ダッシュボード</title>
<style>
  :root {
    color-scheme: light;
    --page-bg: #E9ECEF;
    --card-bg: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid-line: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* 個数・KP・ランキング基調色(blue) */
    --series-2: #eb6834; /* 件数・差し戻し(orange) */
    --series-3: #1baf7a; /* 金額(aqua/green、個数・件数と混同しないよう独立色) */
    --series-4: #eda100; /* 分類4(yellow) */
    --series-5: #e87ba4; /* 分類5(magenta) */
    --tooltip-bg: #0b0b0b;
    --tooltip-fg: #fcfcfb;
    --brand-navy: #1F3A52;
    --brand-accent: #F2A900;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page-bg: #0d0d0d;
      --card-bg: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid-line: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --tooltip-bg: #ffffff;
      --tooltip-fg: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #0d0d0d;
    --card-bg: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid-line: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --tooltip-bg: #ffffff;
    --tooltip-fg: #1a1a19;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text-primary);
    font-family: "Hiragino Sans","Yu Gothic UI","Meiryo","Segoe UI",sans-serif;
    line-height: 1.6;
  }
  .app-header {
    background: var(--brand-navy);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .app-header .back-link {
    display: inline-block;
    font-size: 12.5px;
    color: rgba(255,255,255,.75);
    text-decoration: none;
    margin: 0 0 6px;
  }
  .app-header .eyebrow {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--brand-accent);
    font-weight: 700;
    margin: 0 0 4px;
  }
  .app-header h1 { margin: 0; font-size: 21px; font-weight: 700; }
  .app-header .updated {
    font-size: 12px;
    color: rgba(255,255,255,.7);
    text-align: right;
    padding-top: 4px;
  }
  .refresh-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 6px;
  }
  .refresh-btn:hover { background: rgba(255,255,255,.16); }
  .refresh-btn:disabled { opacity: .5; cursor: default; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 64px; }

  .status-banner {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .status-banner.error { color: #d03b3b; }
  .status-banner .retry-btn {
    display: inline-block;
    margin-top: 12px;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-primary);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
    gap: 18px;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .kpi {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi .kpi-label { font-size: 12px; color: var(--text-muted); margin: 0 0 6px; }
  .kpi .kpi-value { font-size: 26px; font-weight: 700; margin: 0; }
  .kpi .kpi-delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .kpi .kpi-delta.up { color: #d03b3b; }
  .kpi .kpi-delta.down { color: #006300; }
  .kpi svg.spark { display: block; margin-top: 8px; width: 100%; height: 28px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 16px;
    position: relative;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .card-head h3 { font-size: 14px; margin: 0; font-weight: 700; }
  .card .subtitle { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }
  .table-toggle {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .table-toggle:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .table-toggle:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 1px; }

  .viz { display: block; }
  .chart-table { display: none; }
  .card.showing-table .viz { display: none; }
  .card.showing-table .chart-table { display: block; }

  .card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 11.5px; color: var(--text-secondary); margin-top: 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .chart-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .chart-table th, .chart-table td {
    text-align: right;
    padding: 5px 8px;
    border-bottom: 1px solid var(--grid-line);
    font-variant-numeric: tabular-nums;
  }
  .chart-table th:first-child, .chart-table td:first-child { text-align: left; font-variant-numeric: normal; }
  .chart-table thead th { color: var(--text-muted); font-weight: 600; font-size: 11px; }

  .caption-note {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--grid-line);
  }

  .gridline { stroke: var(--grid-line); stroke-width: 1; }
  .baseline-axis { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 10.5px; }
  .value-label { fill: var(--text-secondary); font-size: 10.5px; font-weight: 600; }

  .mark { cursor: pointer; }
  .mark:hover, .mark:focus { filter: brightness(1.08); }
  .mark:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 1px; }

  #viz-tooltip {
    position: fixed;
    z-index: 40;
    pointer-events: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-fg);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity .08s ease;
    max-width: 220px;
    line-height: 1.5;
  }
  #viz-tooltip.show { opacity: 1; }
  #viz-tooltip .tt-title { font-weight: 700; margin-bottom: 2px; }
  #viz-tooltip .tt-row { display: flex; justify-content: space-between; gap: 10px; }
  #viz-tooltip .tt-row .k { display: flex; align-items: center; gap: 5px; opacity: .85; }
  #viz-tooltip .tt-row .dot { width: 7px; height: 7px; border-radius: 2px; }
  #viz-tooltip .tt-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    #viz-tooltip { transition: none; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <a class="back-link" href="./index.html">← 不良入力にもどる</a>
    <p class="eyebrow">品質保証課アプリ</p>
    <h1>品質不良ダッシュボード</h1>
  </div>
  <div>
    <p class="updated" id="updated-at"></p>
    <button class="refresh-btn" id="refresh-btn" type="button">更新</button>
  </div>
</div>

<div class="wrap">
  <div id="status-banner" class="status-banner">データを読み込んでいます…</div>
  <div id="kpi-row"></div>
  <div class="grid" id="grid-main"></div>
</div>

<div id="viz-tooltip" role="tooltip"></div>

<script>
(function () {
  "use strict";

  // GAS Web AppのデプロイURL(index.htmlのGAS_URLと同じ)。WebApi.gsのdoGet(mode=dashboard)を呼ぶ。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbygThIm2QVUek5ZSvUIuayfY3nUSmktUggkwZtc_Ezzc1GPA8VudiGAg2GKlHS4gfAI/exec';

  /* ---------------------------------------------------------------- */
  /* 0. データ取得                                                     */
  /* ---------------------------------------------------------------- */
  var MONTHS, monthlyQty, monthlyCount, monthlyAmountKP,
    DEFECT_GROUPS, stackedByGroup, CAUSE_GROUPS, causeTotals,
    CUSTOMERS, MACHINES, defectRate, kpReworkRatio;

  function applyData(data) {
    MONTHS = data.months;
    monthlyQty = data.monthlyQty;
    monthlyCount = data.monthlyCount;
    monthlyAmountKP = data.monthlyAmountKP;
    DEFECT_GROUPS = data.defectGroups;
    stackedByGroup = data.stackedByGroup;
    CAUSE_GROUPS = data.causeGroups;
    causeTotals = data.causeTotals;
    CUSTOMERS = data.customers || [];
    MACHINES = data.machines || [];
    defectRate = data.defectRate;
    kpReworkRatio = (data.kpReworkRatio || []).map(function (s, i) {
      return { label: s.label, value: s.value, color: i === 0 ? 'var(--series-1)' : 'var(--series-2)' };
    });
    if (data.updatedAt) {
      var d = new Date(data.updatedAt);
      document.getElementById('updated-at').textContent =
        '最終更新: ' + d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  }

  function fetchAndRender() {
    var banner = document.getElementById('status-banner');
    var refreshBtn = document.getElementById('refresh-btn');
    banner.className = 'status-banner';
    banner.textContent = 'データを読み込んでいます…';
    banner.style.display = 'block';
    document.getElementById('kpi-row').innerHTML = '';
    document.getElementById('grid-main').innerHTML = '';
    refreshBtn.disabled = true;

    fetch(GAS_URL + '?mode=dashboard')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        if (!data.months || !data.monthlyQty) throw new Error('想定した形式のデータが返ってきませんでした');
        applyData(data);
        banner.style.display = 'none';
        renderAll();
      })
      .catch(function (err) {
        banner.className = 'status-banner error';
        banner.innerHTML = '';
        banner.appendChild(document.createTextNode('データの取得に失敗しました: ' + err.message));
        var retry = document.createElement('button');
        retry.className = 'retry-btn';
        retry.type = 'button';
        retry.textContent = 'もう一度読み込む';
        retry.addEventListener('click', fetchAndRender);
        banner.appendChild(document.createElement('br'));
        banner.appendChild(retry);
      })
      .finally(function () { refreshBtn.disabled = false; });
  }
  document.getElementById('refresh-btn').addEventListener('click', fetchAndRender);

  /* ---------------------------------------------------------------- */
  /* 1. 汎用ユーティリティ                                              */
  /* ---------------------------------------------------------------- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function h(tag, attrs, children) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function fmtInt(v) { return (v || 0).toLocaleString('ja-JP'); }
  function fmtYen(v) { return '¥' + (v || 0).toLocaleString('ja-JP'); }
  function niceMax(v) {
    if (v <= 0) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var norm = v / mag;
    var nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return nice * mag;
  }

  var tooltipEl = document.getElementById('viz-tooltip');
  function showTooltip(x, y, titleText, rows) {
    tooltipEl.innerHTML = '';
    var t = h('div', { class: 'tt-title', text: titleText });
    tooltipEl.appendChild(t);
    rows.forEach(function (r) {
      var row = h('div', { class: 'tt-row' });
      var k = h('span', { class: 'k' });
      if (r.color) k.appendChild(h('span', { class: 'dot', style: 'background:' + r.color }));
      k.appendChild(document.createTextNode(r.label));
      var v = h('span', { class: 'v', text: r.value });
      row.appendChild(k); row.appendChild(v);
      tooltipEl.appendChild(row);
    });
    tooltipEl.style.left = x + 'px';
    tooltipEl.style.top = (y - 10) + 'px';
    tooltipEl.classList.add('show');
  }
  function hideTooltip() { tooltipEl.classList.remove('show'); }

  function attachMarkTooltip(node, titleText, rows) {
    node.classList.add('mark');
    node.setAttribute('tabindex', '0');
    node.setAttribute('role', 'img');
    node.setAttribute('aria-label', titleText + ': ' + rows.map(function (r) { return r.label + ' ' + r.value; }).join(', '));
    function on(e) {
      var pt = e.touches ? e.touches[0] : e;
      var cx = pt ? pt.clientX : node.getBoundingClientRect().left + node.getBoundingClientRect().width / 2;
      var cy = pt ? pt.clientY : node.getBoundingClientRect().top;
      showTooltip(cx, cy, titleText, rows);
    }
    node.addEventListener('pointermove', on);
    node.addEventListener('pointerenter', on);
    node.addEventListener('pointerleave', hideTooltip);
    node.addEventListener('focus', function () {
      var r = node.getBoundingClientRect();
      showTooltip(r.left + r.width / 2, r.top, titleText, rows);
    });
    node.addEventListener('blur', hideTooltip);
  }

  function legendFor(container, items) {
    var l = h('div', { class: 'legend' });
    items.forEach(function (it) {
      l.appendChild(h('span', { class: 'key' }, [
        h('span', { class: 'swatch', style: 'background:' + it.color }),
        document.createTextNode(it.label)
      ]));
    });
    container.appendChild(l);
  }

  function makeCard(parent, opts) {
    var card = h('div', { class: 'card' });
    var head = h('div', { class: 'card-head' });
    var titleWrap = h('div');
    titleWrap.appendChild(h('h3', { text: opts.title }));
    if (opts.subtitle) titleWrap.appendChild(h('p', { class: 'subtitle', text: opts.subtitle }));
    head.appendChild(titleWrap);
    var toggle = h('button', { class: 'table-toggle', type: 'button', text: '表で見る' });
    toggle.addEventListener('click', function () {
      var showing = card.classList.toggle('showing-table');
      toggle.textContent = showing ? 'グラフで見る' : '表で見る';
    });
    head.appendChild(toggle);
    card.appendChild(head);

    var vizWrap = h('div', { class: 'viz' });
    var tableWrap = h('div', { class: 'chart-table' });
    card.appendChild(vizWrap);
    card.appendChild(tableWrap);
    opts.buildViz(vizWrap);
    opts.buildTable(tableWrap);
    if (opts.note) card.appendChild(h('p', { class: 'caption-note', text: opts.note }));
    parent.appendChild(card);
    return card;
  }

  /* ---------------------------------------------------------------- */
  /* 2. チャート描画関数                                                */
  /* ---------------------------------------------------------------- */
  var W = 760, H = 400;
  var M = { top: 28, right: 16, bottom: 30, left: 46 };

  /* 系列色ごとに、常時表示ラベルを塗り内に置くときの文字色(コントラスト確保用) */
  var LABEL_INK_ON = {
    'var(--series-1)': '#ffffff',
    'var(--series-2)': '#ffffff',
    'var(--series-3)': '#ffffff',
    'var(--series-4)': '#241900',
    'var(--series-5)': '#2a0014'
  };

  function axisAndGrid(svg, maxVal, plotW, plotH) {
    var steps = 4;
    for (var i = 0; i <= steps; i++) {
      var y = M.top + plotH - (plotH * i / steps);
      svg.appendChild(el('line', { class: i === 0 ? 'baseline-axis' : 'gridline', x1: M.left, x2: M.left + plotW, y1: y, y2: y }));
      var val = Math.round(maxVal * i / steps);
      var t = el('text', { class: 'axis-label', x: M.left - 6, y: y + 3, 'text-anchor': 'end' });
      t.textContent = fmtInt(val);
      svg.appendChild(t);
    }
  }

  function buildGroupedBar(container, categories, series, opts) {
    opts = opts || {};
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var maxVal = niceMax(Math.max.apply(null, series.flatMap(function (s) { return s.values; })) * 1.15);
    axisAndGrid(svg, maxVal, plotW, plotH);

    var n = categories.length, sN = series.length;
    var groupW = plotW / n;
    var barW = Math.min(24, (groupW - 8) / sN);
    var gap = 2;

    categories.forEach(function (cat, ci) {
      var gx = M.left + ci * groupW;
      series.forEach(function (s, si) {
        var v = s.values[ci];
        var bh = plotH * (v / maxVal);
        var bx = gx + (groupW - sN * barW - (sN - 1) * gap) / 2 + si * (barW + gap);
        var by = M.top + plotH - bh;
        var rect = el('rect', {
          x: bx, y: by, width: barW, height: Math.max(bh, 1),
          rx: 4, ry: 4, fill: s.color
        });
        attachMarkTooltip(rect, cat, [{ label: s.name, value: opts.fmt ? opts.fmt(v) : fmtInt(v), color: s.color }]);
        svg.appendChild(rect);
        var vLab = el('text', { class: 'value-label', x: bx + barW / 2, y: by - 6, 'text-anchor': 'middle' });
        vLab.textContent = opts.fmt ? opts.fmt(v) : fmtInt(v);
        svg.appendChild(vLab);
      });
      var lab = el('text', { class: 'axis-label', x: gx + groupW / 2, y: H - 8, 'text-anchor': 'middle' });
      lab.textContent = cat;
      svg.appendChild(lab);
    });
    container.appendChild(svg);
    if (sN > 1) legendFor(container, series.map(function (s) { return { label: s.name, color: s.color }; }));
  }

  /** 個数(棒)と件数(折れ線)を同じ軸上に重ねる複合グラフ(どちらも「件」単位のため軸を共有できる) */
  function buildBarLineCombo(container, categories, barSeries, lineSeries) {
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var maxVal = niceMax(Math.max(Math.max.apply(null, barSeries.values), Math.max.apply(null, lineSeries.values)) * 1.25);
    axisAndGrid(svg, maxVal, plotW, plotH);

    var n = categories.length;
    var groupW = plotW / n;
    var barW = Math.min(24, groupW - 14);

    var linePts = [];
    categories.forEach(function (cat, ci) {
      var gx = M.left + ci * groupW;
      var v = barSeries.values[ci];
      var bh = plotH * (v / maxVal);
      var bx = gx + (groupW - barW) / 2;
      var by = M.top + plotH - bh;
      var rect = el('rect', { x: bx, y: by, width: barW, height: Math.max(bh, 1), rx: 4, ry: 4, fill: barSeries.color });
      attachMarkTooltip(rect, cat, [
        { label: barSeries.name, value: fmtInt(v), color: barSeries.color },
        { label: lineSeries.name, value: fmtInt(lineSeries.values[ci]), color: lineSeries.color }
      ]);
      svg.appendChild(rect);
      var vLab = el('text', { class: 'value-label', x: bx + barW / 2, y: by - 6, 'text-anchor': 'middle' });
      vLab.textContent = fmtInt(v);
      svg.appendChild(vLab);

      var lab = el('text', { class: 'axis-label', x: gx + groupW / 2, y: H - 8, 'text-anchor': 'middle' });
      lab.textContent = cat;
      svg.appendChild(lab);

      var lv = lineSeries.values[ci];
      linePts.push([gx + groupW / 2, M.top + plotH - plotH * (lv / maxVal)]);
    });

    var linePath = 'M' + linePts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    svg.appendChild(el('path', { d: linePath, fill: 'none', stroke: lineSeries.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    linePts.forEach(function (p, i) {
      svg.appendChild(el('circle', { cx: p[0], cy: p[1], r: 5, fill: lineSeries.color, stroke: 'var(--card-bg)', 'stroke-width': 2 }));
      var vLab = el('text', { class: 'value-label', x: p[0], y: p[1] - 10, 'text-anchor': 'middle' });
      vLab.textContent = fmtInt(lineSeries.values[i]);
      svg.appendChild(vLab);
    });

    container.appendChild(svg);
    legendFor(container, [
      { label: barSeries.name + '(棒)', color: barSeries.color },
      { label: lineSeries.name + '(折れ線)', color: lineSeries.color }
    ]);
  }

  function buildStackedBar(container, categories, series) {
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var totals = categories.map(function (_, ci) { return series.reduce(function (a, s) { return a + s.values[ci]; }, 0); });
    var maxVal = niceMax(Math.max.apply(null, totals) * 1.1);
    axisAndGrid(svg, maxVal, plotW, plotH);

    var n = categories.length;
    var groupW = plotW / n;
    var barW = Math.min(24, groupW - 10);

    categories.forEach(function (cat, ci) {
      var gx = M.left + ci * groupW + (groupW - barW) / 2;
      var yCursor = M.top + plotH;
      series.forEach(function (s) {
        var v = s.values[ci];
        var bh = plotH * (v / maxVal);
        if (bh <= 0) return;
        var by = yCursor - bh;
        var rect = el('rect', {
          x: gx, y: by + 1, width: barW, height: Math.max(bh - 2, 1),
          fill: s.color
        });
        attachMarkTooltip(rect, cat, [{ label: s.name, value: fmtInt(v), color: s.color }]);
        svg.appendChild(rect);
        if (bh >= 18) {
          var segLab = el('text', {
            x: gx + barW / 2, y: by + bh / 2 + 4, 'text-anchor': 'middle',
            fill: LABEL_INK_ON[s.color] || '#fff', 'font-size': '10.5', 'font-weight': '700'
          });
          segLab.textContent = fmtInt(v);
          svg.appendChild(segLab);
        }
        yCursor -= bh;
      });
      var lab = el('text', { class: 'axis-label', x: gx + barW / 2, y: H - 8, 'text-anchor': 'middle' });
      lab.textContent = cat;
      svg.appendChild(lab);
    });
    container.appendChild(svg);
    legendFor(container, series.map(function (s) { return { label: s.name, color: s.color }; }));
  }

  function buildLine(container, categories, values, color, opts) {
    opts = opts || {};
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var maxVal = niceMax(Math.max.apply(null, values) * 1.2);
    axisAndGrid(svg, maxVal, plotW, plotH);

    var n = categories.length;
    var stepX = plotW / (n - 1);
    var pts = values.map(function (v, i) {
      return [M.left + i * stepX, M.top + plotH - plotH * (v / maxVal)];
    });

    var areaPath = 'M' + pts[0][0] + ',' + (M.top + plotH) + ' ' +
      pts.map(function (p) { return 'L' + p[0] + ',' + p[1]; }).join(' ') +
      ' L' + pts[pts.length - 1][0] + ',' + (M.top + plotH) + ' Z';
    svg.appendChild(el('path', { d: areaPath, fill: color, opacity: '0.1' }));

    var linePath = 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    svg.appendChild(el('path', { d: linePath, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    pts.forEach(function (p, i) {
      var g = el('g', {});
      g.appendChild(el('circle', { cx: p[0], cy: p[1], r: 5, fill: color, stroke: 'var(--card-bg)', 'stroke-width': 2 }));
      var hit = el('circle', { cx: p[0], cy: p[1], r: 12, fill: 'transparent' });
      attachMarkTooltip(hit, categories[i], [{ label: opts.seriesName || '値', value: (opts.fmt ? opts.fmt(values[i]) : fmtInt(values[i])), color: color }]);
      g.appendChild(hit);
      svg.appendChild(g);
      var lab = el('text', { class: 'axis-label', x: p[0], y: H - 8, 'text-anchor': 'middle' });
      lab.textContent = categories[i];
      svg.appendChild(lab);
      var vLab = el('text', { class: 'value-label', x: p[0], y: p[1] - 12, 'text-anchor': 'middle' });
      vLab.textContent = opts.fmt ? opts.fmt(values[i]) : fmtInt(values[i]);
      svg.appendChild(vLab);
    });

    container.appendChild(svg);
  }

  function buildRanking(container, items, color, opts) {
    opts = opts || {};
    var sorted = items.slice().sort(function (a, b) { return b.value - a.value; });
    var topPad = 10, gap = 8;
    var rowSlot = (H - topPad * 2) / Math.max(sorted.length, 1);
    var rowH = Math.min(24, rowSlot - gap);
    var plotLeft = 84, plotRight = 74;
    var rh = W - plotLeft - plotRight;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var maxVal = niceMax(Math.max.apply(null, sorted.map(function (d) { return d.value; })) * 1.15);

    sorted.forEach(function (d, i) {
      var y = topPad + i * rowSlot + (rowSlot - rowH) / 2;
      var bw = rh * (d.value / maxVal);
      var labelText = el('text', { class: 'axis-label', x: plotLeft - 8, y: y + rowH / 2 + 4, 'text-anchor': 'end' });
      labelText.textContent = d.label;
      svg.appendChild(labelText);
      var rect = el('rect', { x: plotLeft, y: y, width: Math.max(bw, 2), height: rowH, rx: 4, ry: 4, fill: color });
      attachMarkTooltip(rect, d.label, [{ label: opts.metricName || '値', value: opts.fmt ? opts.fmt(d.value) : fmtInt(d.value), color: color }]);
      svg.appendChild(rect);
      var vt = el('text', { class: 'value-label', x: plotLeft + bw + 8, y: y + rowH / 2 + 4 });
      vt.textContent = opts.fmt ? opts.fmt(d.value) : fmtInt(d.value);
      svg.appendChild(vt);
    });
    container.appendChild(svg);
  }

  function build100StackedBar(container, segments) {
    var total = segments.reduce(function (a, s) { return a + s.value; }, 0) || 1;
    var barH = 34;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + (barH + 30) });
    var x = 0;
    segments.forEach(function (s) {
      var w = (W - (segments.length - 1) * 2) * (s.value / total);
      var rect = el('rect', { x: x, y: 0, width: Math.max(w, 1), height: barH, fill: s.color });
      attachMarkTooltip(rect, s.label, [{ label: '比率', value: s.value + '%', color: s.color }]);
      svg.appendChild(rect);
      if (w > 46) {
        var t = el('text', { x: x + w / 2, y: barH / 2 + 4, 'text-anchor': 'middle', fill: '#fff', 'font-size': '12', 'font-weight': '700' });
        t.textContent = s.value + '%';
        svg.appendChild(t);
      }
      x += w + 2;
    });
    container.appendChild(svg);
    legendFor(container, segments.map(function (s) { return { label: s.label + '(' + s.value + '%)', color: s.color }; }));
  }

  /* ---------------------------------------------------------------- */
  /* 3. 表(アクセシビリティ用)描画関数                                    */
  /* ---------------------------------------------------------------- */
  function buildSimpleTable(container, headers, rows) {
    var table = h('table');
    var thead = h('thead');
    var trh = h('tr');
    headers.forEach(function (hd) { trh.appendChild(h('th', { text: hd })); });
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = h('tbody');
    rows.forEach(function (r) {
      var tr = h('tr');
      r.forEach(function (c) { tr.appendChild(h('td', { text: String(c) })); });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.appendChild(table);
  }

  /* ---------------------------------------------------------------- */
  /* 4. KPIタイル                                                      */
  /* ---------------------------------------------------------------- */
  function buildSparkline(container, values, color) {
    var svg = el('svg', { class: 'spark', viewBox: '0 0 120 28', preserveAspectRatio: 'none' });
    var maxV = Math.max.apply(null, values), minV = Math.min.apply(null, values);
    var range = (maxV - minV) || 1;
    var stepX = 120 / (values.length - 1);
    var pts = values.map(function (v, i) { return [i * stepX, 26 - ((v - minV) / range) * 22 - 2]; });
    var path = 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    svg.appendChild(el('path', { d: path, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    var last = pts[pts.length - 1];
    svg.appendChild(el('circle', { cx: last[0], cy: last[1], r: 3, fill: color }));
    container.appendChild(svg);
  }

  function buildKpiRow(container) {
    var thisMonthQty = monthlyQty[monthlyQty.length - 1];
    var prevQty = monthlyQty[monthlyQty.length - 2];
    var qtyDelta = prevQty ? Math.round(((thisMonthQty - prevQty) / prevQty) * 100) : 0;
    var thisMonthAmount = monthlyAmountKP[monthlyAmountKP.length - 1];
    var prevAmount = monthlyAmountKP[monthlyAmountKP.length - 2];
    var amtDelta = prevAmount ? Math.round(((thisMonthAmount - prevAmount) / prevAmount) * 100) : 0;
    var thisRate = defectRate[defectRate.length - 1];
    var prevRate = defectRate[defectRate.length - 2];
    var rateDelta = Math.round((thisRate - prevRate) * 10) / 10;

    var kpTile = kpReworkRatio[0] || { value: 0 };
    var reworkTile = kpReworkRatio[1] || { value: 0 };

    var tiles = [
      { label: '今月 不良個数', value: fmtInt(thisMonthQty) + ' 個', delta: qtyDelta, series: monthlyQty, color: 'var(--series-1)' },
      { label: '今月 不良金額(KP)', value: fmtYen(thisMonthAmount), delta: amtDelta, series: monthlyAmountKP, color: 'var(--series-3)' },
      { label: '今月 不良率', value: thisRate + '%', delta: rateDelta, deltaIsPoint: true, series: defectRate, color: 'var(--series-1)' },
      { label: '社内不良(KP)比率', value: kpTile.value + '%', note: '差し戻し ' + reworkTile.value + '%', series: null, color: 'var(--series-1)' }
    ];

    var row = h('div', { class: 'kpi-row' });
    tiles.forEach(function (t) {
      var card = h('div', { class: 'kpi' });
      card.appendChild(h('p', { class: 'kpi-label', text: t.label }));
      card.appendChild(h('p', { class: 'kpi-value', text: t.value }));
      if (typeof t.delta === 'number') {
        var up = t.delta > 0;
        var deltaText = (up ? '+' : '') + t.delta + (t.deltaIsPoint ? 'pt' : '%') + ' 前月比';
        card.appendChild(h('p', { class: 'kpi-delta ' + (up ? 'up' : 'down'), text: deltaText }));
      } else if (t.note) {
        card.appendChild(h('p', { class: 'kpi-delta', style: 'color:var(--text-muted)', text: t.note }));
      }
      if (t.series) buildSparkline(card, t.series, t.color);
      row.appendChild(card);
    });
    container.appendChild(row);
  }

  /* ---------------------------------------------------------------- */
  /* 5. グラフカードの組み立て                                          */
  /* ---------------------------------------------------------------- */
  function cardMonthlyQtyCount(parent) {
    makeCard(parent, {
      title: '月別 不良個数・件数',
      subtitle: '個数(棒)・件数(折れ線)は同じ「件」単位のため軸を共有して重ね表示',
      buildViz: function (v) {
        buildBarLineCombo(v, MONTHS,
          { name: '個数', color: 'var(--series-1)', values: monthlyQty },
          { name: '件数', color: 'var(--series-2)', values: monthlyCount }
        );
      },
      buildTable: function (t) {
        buildSimpleTable(t, ['月', '個数', '件数'], MONTHS.map(function (m, i) { return [m, monthlyQty[i], monthlyCount[i]]; }));
      }
    });
  }
  function cardMonthlyAmount(parent) {
    makeCard(parent, {
      title: '月別 不良金額(社内不良KPのみ)',
      subtitle: '桁が違うため個数・件数とは別グラフ。上のグラフと同じ月並びで揃えて比較',
      buildViz: function (v) {
        buildGroupedBar(v, MONTHS, [{ name: '金額', color: 'var(--series-3)', values: monthlyAmountKP }], { fmt: fmtYen });
      },
      buildTable: function (t) {
        buildSimpleTable(t, ['月', '金額'], MONTHS.map(function (m, i) { return [m, fmtYen(monthlyAmountKP[i])]; }));
      }
    });
  }
  function cardStackedGroup(parent) {
    var colors = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)', 'var(--series-5)'];
    makeCard(parent, {
      title: '分類別内訳(月別・積み上げ)',
      subtitle: DEFECT_GROUPS.join('・') + 'の月別内訳',
      buildViz: function (v) {
        buildStackedBar(v, MONTHS, DEFECT_GROUPS.map(function (g, i) {
          return { name: g, color: colors[i % colors.length], values: stackedByGroup.map(function (row) { return row[i]; }) };
        }));
      },
      buildTable: function (t) {
        buildSimpleTable(t, ['月'].concat(DEFECT_GROUPS), MONTHS.map(function (m, mi) {
          return [m].concat(DEFECT_GROUPS.map(function (_, gi) { return stackedByGroup[mi][gi]; }));
        }));
      }
    });
  }
  function cardCauseRanking(parent) {
    makeCard(parent, {
      title: 'キズ原因内訳(年計)',
      subtitle: '原因グループ別、多い順。任意項目のため参考値',
      buildViz: function (v) {
        buildRanking(v, CAUSE_GROUPS.map(function (c, i) { return { label: c, value: causeTotals[i] }; }), 'var(--series-1)', { metricName: '個数' });
      },
      buildTable: function (t) {
        var rows = CAUSE_GROUPS.map(function (c, i) { return [c, causeTotals[i]]; }).sort(function (a, b) { return b[1] - a[1]; });
        buildSimpleTable(t, ['原因グループ', '個数'], rows);
      }
    });
  }
  function cardCustomerRanking(parent) {
    makeCard(parent, {
      title: '得意先別 不良金額ランキング',
      subtitle: '上位' + CUSTOMERS.length + '件、社内不良(KP)の金額ベース',
      buildViz: function (v) {
        buildRanking(v, CUSTOMERS, 'var(--series-1)', { metricName: '金額', fmt: fmtYen });
      },
      buildTable: function (t) {
        var pairs = CUSTOMERS.slice().sort(function (a, b) { return b.value - a.value; });
        buildSimpleTable(t, ['得意先', '金額'], pairs.map(function (p) { return [p.label, fmtYen(p.value)]; }));
      },
      note: 'どの得意先向けで不良が多いかが分かり、優先的に対策すべき案件の判断材料になります。'
    });
  }
  function cardMachineRanking(parent) {
    makeCard(parent, {
      title: '設備別 不良個数',
      subtitle: '機種名ごとの不良個数(年計)',
      buildViz: function (v) {
        buildRanking(v, MACHINES, 'var(--series-1)', { metricName: '個数' });
      },
      buildTable: function (t) {
        var rows = MACHINES.slice().sort(function (a, b) { return b.value - a.value; }).map(function (p) { return [p.label, p.value]; });
        buildSimpleTable(t, ['設備', '個数'], rows);
      },
      note: '設備の保全・段取り見直しの優先度づけに使えます。'
    });
  }
  function cardDefectRate(parent) {
    makeCard(parent, {
      title: '不良率の月次推移',
      subtitle: '加工数に対する不良数の割合(%)',
      buildViz: function (v) {
        buildLine(v, MONTHS, defectRate, 'var(--series-1)', { seriesName: '不良率', fmt: function (x) { return x + '%'; } });
      },
      buildTable: function (t) {
        buildSimpleTable(t, ['月', '不良率'], MONTHS.map(function (m, i) { return [m, defectRate[i] + '%']; }));
      },
      note: '個数・金額は絶対量、不良率は生産量あたりの効率を示す指標として補完的に見られます。'
    });
  }
  function cardKpRework(parent) {
    makeCard(parent, {
      title: '社内不良(KP)と差し戻しの比率',
      subtitle: '年計、個数ベースの構成比',
      buildViz: function (v) { build100StackedBar(v, kpReworkRatio); },
      buildTable: function (t) {
        buildSimpleTable(t, ['区分', '比率'], kpReworkRatio.map(function (s) { return [s.label, s.value + '%']; }));
      }
    });
  }

  function renderAll() {
    buildKpiRow(document.getElementById('kpi-row'));
    var grid = document.getElementById('grid-main');
    cardMonthlyQtyCount(grid);
    cardMonthlyAmount(grid);
    cardStackedGroup(grid);
    cardCauseRanking(grid);
    cardDefectRate(grid);
    cardKpRework(grid);
    cardCustomerRanking(grid);
    cardMachineRanking(grid);
  }

  fetchAndRender();
})();
</script>
</body>
</html>
